name: Mobile app checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx expo export --platform android
