name: Build Android APK for releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Build YPA Sasula Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_NO_AUTH_TEST_MODE: "true"
      RELEASE_TAG: ${{ github.event.release.tag_name || format('build-{0}', github.run_number) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate API URL and test public API connectivity
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${EXPO_PUBLIC_API_URL:-}" ]]; then
            echo "::error::EXPO_PUBLIC_API_URL is not configured. Set it in Settings > Secrets and variables > Actions > Variables to the reachable API base URL ending in /api/v1."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const value = process.env.EXPO_PUBLIC_API_URL;
          let url;
          try { url = new URL(value); } catch { throw new Error("EXPO_PUBLIC_API_URL must be a valid absolute URL."); }
          if (!["http:", "https:"].includes(url.protocol)) throw new Error("API URL must use HTTP or HTTPS.");
          if (url.pathname.replace(/\\/+$/, "") !== "/api/v1") throw new Error("API URL must end in /api/v1.");
          if (["localhost", "127.0.0.1", "0.0.0.0", "::1"].includes(url.hostname.toLowerCase())) throw new Error("localhost cannot be used in a phone APK; use a reachable LAN IP or public HTTPS hostname.");
          const privateIPv4 = /^(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|169\\.254\\.)/.test(url.hostname);
          if (url.protocol === "http:" && !privateIPv4) throw new Error("Use HTTPS for public APIs. Plain HTTP is accepted only for private LAN testing.");
          console.log("API URL format validated:", url.origin + url.pathname);
          console.log(url.protocol === "https:" ? "Public HTTPS API will be health-checked." : "Private LAN API: GitHub runners cannot reach your private network; connectivity must be tested from the phone.");
          NODE
          if [[ "${EXPO_PUBLIC_API_URL}" == https://* ]]; then
            API_ORIGIN="$(node -p 'new URL(process.env.EXPO_PUBLIC_API_URL).origin')"
            curl --fail --show-error --silent --max-time 15 "${API_ORIGIN}/health"
            echo
            curl --fail --show-error --silent --max-time 15 "${API_ORIGIN}/ready"
            echo
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Set Android app version and version code
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "app.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          const releaseTag = process.env.RELEASE_TAG || "";
          const semver = releaseTag.replace(/^v/, "");
          if (process.env.GITHUB_EVENT_NAME === "release" && /^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$/.test(semver)) {
            config.expo.version = semver;
          }
          config.expo.android = config.expo.android || {};
          config.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK only
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          SAFE_RELEASE_TAG="${RELEASE_TAG//\//-}"

          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "::error::Missing Android signing secrets. Release APK builds are required and cannot proceed without ANDROID_KEYSTORE_* secrets."
            exit 1
          fi

          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/ypa-release.keystore
          chmod 600 android/app/ypa-release.keystore

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_match = re.search(r"(?m)^([ \t]*)signingConfigs[ \t]*\{", text)
          if signing_match:
              open_brace = text.index("{", signing_match.start())
              depth = 0
              close_brace = None
              for index in range(open_brace, len(text)):
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          close_brace = index
                          break
              if close_brace is None:
                  raise SystemExit("Could not parse signingConfigs block in generated Gradle file.")
              indent = signing_match.group(1) + "    "
              signing_block = f'''
          {indent}release {{
          {indent}    storeFile file("ypa-release.keystore")
          {indent}    storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
          {indent}    keyAlias System.getenv("ANDROID_KEY_ALIAS")
          {indent}    keyPassword System.getenv("ANDROID_KEY_PASSWORD")
          {indent}}}
          '''
              text = text[:close_brace] + signing_block + text[close_brace:]
          else:
              build_types = re.search(r"(?m)^([ \t]*)buildTypes[ \t]*\{", text)
              if not build_types:
                  raise SystemExit("Could not find buildTypes block in generated Gradle file.")
              indent = build_types.group(1)
              signing_block = f'''{indent}signingConfigs {{
          {indent}    release {{
          {indent}        storeFile file("ypa-release.keystore")
          {indent}        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
          {indent}        keyAlias System.getenv("ANDROID_KEY_ALIAS")
          {indent}        keyPassword System.getenv("ANDROID_KEY_PASSWORD")
          {indent}    }}
          {indent}}}

          '''
              text = text[:build_types.start()] + signing_block + text[build_types.start():]

          build_types = re.search(r"(?m)^[ \t]*buildTypes[ \t]*\{", text)
          release = re.search(r"(?m)^([ \t]*)release[ \t]*\{", text[build_types.end():])
          if not build_types or not release:
              raise SystemExit("Could not find release build type in generated Gradle file.")
          release_start = build_types.end() + release.start()
          brace = text.index("{", release_start)
          text = text[:brace + 1] + "\n" + release.group(1) + "    signingConfig signingConfigs.release" + text[brace + 1:]
          release_block_start = text.index("release {", build_types.end())
          depth = 0
          release_block_end = None
          for index in range(text.index("{", release_block_start), len(text)):
              if text[index] == "{":
                  depth += 1
              elif text[index] == "}":
                  depth -= 1
                  if depth == 0:
                      release_block_end = index
                      break
          if release_block_end is None:
              raise SystemExit("Could not parse release build type.")
          release_block = text[release_block_start:release_block_end]
          release_block = re.sub(r"signingConfig[ \t]+signingConfigs\.debug", "signingConfig signingConfigs.release", release_block)
          text = text[:release_block_start] + release_block + text[release_block_end:]
          path.write_text(text)
          PY

          (cd android && ./gradlew --no-daemon assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk "dist/YPA-Sasula-${SAFE_RELEASE_TAG}.apk"
          echo "APK_TYPE=release-signed" >> "$GITHUB_ENV"

          if [[ -z "${EXPO_PUBLIC_API_URL:-}" ]]; then
            echo "::warning::Repository variable EXPO_PUBLIC_API_URL is unset. The app will use its localhost development fallback until rebuilt with the deployed API URL."
          fi

      - name: Upload APK as workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: YPA-Sasula-Android-${{ env.RELEASE_TAG }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Attach APK to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
